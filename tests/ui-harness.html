<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>浮生錄 UI Harness</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <h1>宿主測試頁</h1>
    </main>
    <script>
      const listeners = new Map();
      const eventSource = {
        on(name, listener) {
          const group = listeners.get(name) ?? new Set();
          group.add(listener);
          listeners.set(name, group);
        },
        off(name, listener) {
          listeners.get(name)?.delete(listener);
        },
      };
      const context = {
        chatId: 'iphone-ui-test',
        getCurrentChatId: () => 'iphone-ui-test',
        chat: [
          {
            id: 'user-1',
            is_user: true,
            mes: '我們來到藏書閣。',
            send_date: '2026-07-27T00:00:00.000Z',
          },
          {
            id: 'assistant-1',
            is_user: false,
            mes: '守閣弟子遞給你一枚測試木牌。',
            swipe_id: 0,
            send_date: '2026-07-27T00:00:10.000Z',
          },
        ],
        chatMetadata: {},
        async saveMetadata() {},
        async saveChat() {},
        setExtensionPrompt() {},
        eventSource,
        eventTypes: {
          CHAT_CHANGED: 'chat_changed',
          GENERATION_AFTER_COMMANDS: 'generation_after_commands',
          GENERATION_STOPPED: 'generation_stopped',
          MESSAGE_RECEIVED: 'message_received',
        },
      };
      globalThis.SillyTavern = {
        getContext: () => context,
      };
    </script>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
